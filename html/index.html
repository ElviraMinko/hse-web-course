<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доска задач — Спринт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <script type="module" src="../js/main.js"></script>
</head>
<body class="page page-role-admin" data-page="board">
  <svg class="visually-hidden" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="board" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="team" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="invite" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  </svg>

  <div class="app">
    <aside class="app-sidebar">
      <a class="app-logo" href="index.html">
        <span class="app-logo-mark"><svg class="icon" aria-hidden="true"><use href="#logo"/></svg></span>
        <span class="app-logo-name">Спринт</span>
      </a>

      <nav class="app-nav" aria-label="Основная навигация">
        <ul class="app-nav-list">
          <li>
            <a class="app-nav-link app-nav-link-current" href="index.html" aria-current="page">
              <svg class="icon" aria-hidden="true"><use href="#board"/></svg>
              <span class="app-nav-label">Доска</span>
            </a>
          </li>
          <li>
            <a class="app-nav-link app-nav-link-create" href="task-new.html">
              <svg class="icon" aria-hidden="true"><use href="#plus"/></svg>
              <span class="app-nav-label">Новая задача</span>
              <span class="app-nav-label-short">Создать</span>
            </a>
          </li>
          <li>
            <a class="app-nav-link" href="team.html">
              <svg class="icon" aria-hidden="true"><use href="#team"/></svg>
              <span class="app-nav-label">Команда</span>
            </a>
          </li>
        </ul>
      </nav>

      <section class="sprint-summary">
        <h2 class="sprint-summary-caption">Текущий спринт</h2>
        <p class="sprint-summary-name">Спринт 14</p>
        <p class="sprint-summary-dates" id="sprint-dates"></p>
      </section>

      <div class="current-user" id="current-user"></div>
    </aside>

    <main class="app-main board-page">
      <header class="page-header board-header">
        <a class="app-logo board-header-logo" href="index.html" aria-label="Спринт">
          <span class="app-logo-mark"><svg class="icon icon-md" aria-hidden="true"><use href="#logo"/></svg></span>
        </a>
        <div class="page-header-heading">
          <p class="page-header-subtitle">
            Спринт 14 ·
            <span class="board-header-dates" id="board-dates"></span>
            <span class="board-header-done" id="board-done"></span>
          </p>
          <h1 class="page-title">Доска задач</h1>
        </div>
        <button class="icon-button board-header-search-toggle" id="board-search-toggle" type="button" aria-label="Поиск" aria-controls="board-search" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#search"/></svg></button>
        <div class="board-header-actions">
          <div class="sprint-progress">
            <p class="sprint-progress-caption">
              <span class="sprint-progress-label">Выполнено</span>
              <span id="board-progress-text"></span>
            </p>
            <progress class="sprint-progress-bar" id="board-progress" max="1" value="0"></progress>
          </div>
          <a class="button button-secondary board-header-invite" href="team.html"><svg class="icon icon-md" aria-hidden="true"><use href="#invite"/></svg> Пригласить</a>
          <a class="button button-primary board-header-create" href="task-new.html"><svg class="icon icon-md" aria-hidden="true"><use href="#plus"/></svg> Новая задача</a>
        </div>
      </header>

      <div class="board-toolbar" id="board-toolbar">
        <form class="board-search" id="board-search" role="search">
          <svg class="icon icon-md board-search-icon" aria-hidden="true"><use href="#search"/></svg>
          <input class="input board-search-input" id="board-search-input" type="search" placeholder="Поиск по названию или тегу" aria-label="Поиск по задачам">
        </form>
        <fieldset class="filter-chips" id="board-filter">
          <legend class="visually-hidden">Фильтр задач</legend>
          <label class="filter-chips-option"><input class="visually-hidden" type="radio" name="filter" value="all" checked> Все задачи</label>
          <label class="filter-chips-option"><input class="visually-hidden" type="radio" name="filter" value="mine"> Мои</label>
          <label class="filter-chips-option"><input class="visually-hidden" type="radio" name="filter" value="high"> Высокий приоритет</label>
        </fieldset>
        <button class="button button-quiet board-toolbar-reset" id="board-reset" type="button">Сбросить данные</button>
      </div>

      <section class="board" aria-label="Задачи по статусам">
        <input class="visually-hidden" type="radio" name="board-tab" value="backlog" id="tab-backlog">
        <input class="visually-hidden" type="radio" name="board-tab" value="progress" id="tab-progress" checked>
        <input class="visually-hidden" type="radio" name="board-tab" value="review" id="tab-review">
        <input class="visually-hidden" type="radio" name="board-tab" value="done" id="tab-done">

        <div class="board-tabs">
          <label class="board-tab board-tab-backlog" for="tab-backlog">
            <span class="status-dot status-dot-backlog"></span>
            Бэклог
            <span class="board-tab-count" data-tab-count="backlog"></span>
          </label>
          <label class="board-tab board-tab-progress" for="tab-progress">
            <span class="status-dot status-dot-progress"></span>
            В работе
            <span class="board-tab-count" data-tab-count="progress"></span>
          </label>
          <label class="board-tab board-tab-review" for="tab-review">
            <span class="status-dot status-dot-review"></span>
            На ревью
            <span class="board-tab-count" data-tab-count="review"></span>
          </label>
          <label class="board-tab board-tab-done" for="tab-done">
            <span class="status-dot status-dot-done"></span>
            Готово
            <span class="board-tab-count" data-tab-count="done"></span>
          </label>
        </div>

        <div class="board-columns">
          <section class="board-column board-column-backlog" aria-labelledby="column-backlog" data-column="backlog">
            <header class="board-column-header">
              <span class="status-dot status-dot-backlog"></span>
              <h2 class="board-column-title" id="column-backlog">Бэклог</h2>
              <span class="board-column-count" data-column-count></span>
            </header>
            <ul class="board-column-list" data-column-list></ul>
          </section>

          <section class="board-column board-column-progress" aria-labelledby="column-progress" data-column="progress">
            <header class="board-column-header">
              <span class="status-dot status-dot-progress"></span>
              <h2 class="board-column-title" id="column-progress">В работе</h2>
              <span class="board-column-count" data-column-count></span>
            </header>
            <ul class="board-column-list" data-column-list></ul>
          </section>

          <section class="board-column board-column-review" aria-labelledby="column-review" data-column="review">
            <header class="board-column-header">
              <span class="status-dot status-dot-review"></span>
              <h2 class="board-column-title" id="column-review">На ревью</h2>
              <span class="board-column-count" data-column-count></span>
            </header>
            <ul class="board-column-list" data-column-list></ul>
          </section>

          <section class="board-column board-column-done" aria-labelledby="column-done" data-column="done">
            <header class="board-column-header">
              <span class="status-dot status-dot-done"></span>
              <h2 class="board-column-title" id="column-done">Готово</h2>
              <span class="board-column-count" data-column-count></span>
            </header>
            <ul class="board-column-list" data-column-list></ul>
          </section>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
