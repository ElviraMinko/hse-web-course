<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задача — Спринт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <script type="module" src="../js/main.js"></script>
</head>
<body class="page page-role-admin page-flow task-page" data-page="task">
  <svg class="visually-hidden" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="board" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="team" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"/></symbol>
  </svg>

  <div class="app">
    <aside class="app-sidebar">
      <a class="app-logo" href="index.html">
        <span class="app-logo-mark"><svg class="icon" aria-hidden="true"><use href="#logo"/></svg></span>
        <span class="app-logo-name">Спринт</span>
      </a>

      <nav class="app-nav" aria-label="Основная навигация">
        <ul class="app-nav-list">
          <li>
            <a class="app-nav-link app-nav-link-current" href="index.html" aria-current="page">
              <svg class="icon" aria-hidden="true"><use href="#board"/></svg>
              <span class="app-nav-label">Доска</span>
            </a>
          </li>
          <li>
            <a class="app-nav-link app-nav-link-create" href="task-new.html">
              <svg class="icon" aria-hidden="true"><use href="#plus"/></svg>
              <span class="app-nav-label">Новая задача</span>
              <span class="app-nav-label-short">Создать</span>
            </a>
          </li>
          <li>
            <a class="app-nav-link" href="team.html">
              <svg class="icon" aria-hidden="true"><use href="#team"/></svg>
              <span class="app-nav-label">Команда</span>
            </a>
          </li>
        </ul>
      </nav>

      <section class="sprint-summary">
        <h2 class="sprint-summary-caption">Текущий спринт</h2>
        <p class="sprint-summary-name">Спринт 14</p>
        <p class="sprint-summary-dates" id="sprint-dates"></p>
      </section>

      <div class="current-user" id="current-user"></div>
    </aside>

    <main class="app-main" id="task-main">
      <header class="page-header page-header-flow task-topbar">
        <a class="icon-button page-header-back" href="index.html" aria-label="Назад к доске"><svg class="icon" aria-hidden="true"><use href="#back"/></svg></a>
        <p class="page-header-heading task-topbar-code" id="task-topbar-code"></p>
        <a class="icon-button page-header-mobile-action" id="task-edit-mobile" href="task-new.html" aria-label="Редактировать"><svg class="icon" aria-hidden="true"><use href="#edit"/></svg></a>
      </header>

      <header class="page-header task-header">
        <div class="page-header-heading">
          <nav class="breadcrumbs" aria-label="Навигационная цепочка">
            <ol class="breadcrumbs-list">
              <li class="breadcrumbs-item"><a class="breadcrumbs-link" href="index.html">Доска</a></li>
              <li class="breadcrumbs-item" id="task-breadcrumb-code" aria-current="page"></li>
            </ol>
          </nav>
          <h1 class="page-title" id="task-title"></h1>
          <p class="task-header-labels" id="task-labels"></p>
        </div>
        <div class="task-header-actions">
          <select class="input select task-status" id="task-status" aria-label="Статус задачи">
            <option value="backlog">Бэклог</option>
            <option value="progress">В работе</option>
            <option value="review">На ревью</option>
            <option value="done">Готово</option>
          </select>
          <a class="button button-secondary task-header-edit" id="task-edit" href="task-new.html"><svg class="icon icon-sm" aria-hidden="true"><use href="#edit"/></svg> Редактировать</a>
        </div>
      </header>

      <div class="task-layout">
        <section class="panel task-layout-description">
          <h2 class="panel-title">Описание</h2>
          <p class="task-description-text" id="task-description"></p>
        </section>

        <section class="panel task-layout-comments">
          <h2 class="panel-title">Комментарии <span class="panel-title-count" id="task-comments-count"></span></h2>
          <ol class="comment-list" id="task-comments"></ol>
          <form class="comment-form" id="comment-form">
            <span class="avatar avatar-large comment-form-avatar" id="comment-form-avatar"></span>
            <div class="comment-form-fields">
              <textarea class="input input-multiline" id="comment-text" name="text" rows="2" maxlength="1000" required placeholder="Напишите комментарий — Enter отправляет, Shift+Enter переносит строку" aria-label="Новый комментарий"></textarea>
              <button class="button button-primary comment-form-submit">
                <span class="comment-form-submit-text">Отправить</span>
                <svg class="icon" aria-hidden="true"><use href="#send"/></svg>
              </button>
            </div>
          </form>
        </section>

        <section class="panel task-layout-meta">
          <h2 class="panel-title">Детали</h2>
          <dl class="task-meta">
            <div class="task-meta-item task-meta-item-status">
              <dt class="task-meta-term">Статус</dt>
              <dd class="task-meta-value" id="task-meta-status"></dd>
            </div>
            <div class="task-meta-item task-meta-item-assignee">
              <dt class="task-meta-term">Исполнитель</dt>
              <dd class="task-meta-value" id="task-meta-assignee"></dd>
            </div>
            <div class="task-meta-item task-meta-item-author">
              <dt class="task-meta-term">Автор</dt>
              <dd class="task-meta-value" id="task-meta-author"></dd>
            </div>
            <div class="task-meta-item task-meta-item-due">
              <dt class="task-meta-term">Дедлайн</dt>
              <dd class="task-meta-value" id="task-meta-due"></dd>
            </div>
            <div class="task-meta-item task-meta-item-created">
              <dt class="task-meta-term">Создана</dt>
              <dd class="task-meta-value" id="task-meta-created"></dd>
            </div>
            <div class="task-meta-item task-meta-item-priority">
              <dt class="task-meta-term">Приоритет</dt>
              <dd class="task-meta-value" id="task-meta-priority"></dd>
            </div>
            <div class="task-meta-item task-meta-item-tags">
              <dt class="task-meta-term">Теги</dt>
              <dd class="task-meta-value" id="task-meta-tags"></dd>
            </div>
          </dl>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
