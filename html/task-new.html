<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая задача — Спринт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <script type="module" src="../js/main.js"></script>
</head>
<body class="page page-role-admin page-flow form-page" data-page="task-form">
  <svg class="visually-hidden" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="board" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="team" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>

  <div class="app">
    <aside class="app-sidebar">
      <a class="app-logo" href="index.html">
        <span class="app-logo-mark"><svg class="icon" aria-hidden="true"><use href="#logo"/></svg></span>
        <span class="app-logo-name">Спринт</span>
      </a>

      <nav class="app-nav" aria-label="Основная навигация">
        <ul class="app-nav-list">
          <li>
            <a class="app-nav-link" href="index.html">
              <svg class="icon" aria-hidden="true"><use href="#board"/></svg>
              <span class="app-nav-label">Доска</span>
            </a>
          </li>
          <li>
            <a class="app-nav-link app-nav-link-create app-nav-link-current" href="task-new.html" aria-current="page">
              <svg class="icon" aria-hidden="true"><use href="#plus"/></svg>
              <span class="app-nav-label">Новая задача</span>
              <span class="app-nav-label-short">Создать</span>
            </a>
          </li>
          <li>
            <a class="app-nav-link" href="team.html">
              <svg class="icon" aria-hidden="true"><use href="#team"/></svg>
              <span class="app-nav-label">Команда</span>
            </a>
          </li>
        </ul>
      </nav>

      <section class="sprint-summary">
        <h2 class="sprint-summary-caption">Текущий спринт</h2>
        <p class="sprint-summary-name">Спринт 14</p>
        <p class="sprint-summary-dates" id="sprint-dates"></p>
      </section>

      <div class="current-user" id="current-user"></div>
    </aside>

    <main class="app-main">
      <header class="page-header page-header-flow">
        <a class="icon-button page-header-back" id="form-back" href="index.html" aria-label="Закрыть"><svg class="icon" aria-hidden="true"><use href="#close"/></svg></a>
        <div class="page-header-heading">
          <nav class="breadcrumbs" aria-label="Навигационная цепочка">
            <ol class="breadcrumbs-list" id="form-breadcrumbs">
              <li class="breadcrumbs-item"><a class="breadcrumbs-link" href="index.html">Доска</a></li>
              <li class="breadcrumbs-item" aria-current="page">Новая задача</li>
            </ol>
          </nav>
          <h1 class="page-title" id="form-heading">Новая задача</h1>
        </div>
        <button class="button button-text page-header-mobile-action" id="form-reset-mobile" type="reset" form="task-form">Очистить</button>
      </header>

      <div class="task-editor">
        <form class="task-form" id="task-form" action="index.html" novalidate>
          <div class="form-field">
            <div class="form-field-head">
              <label class="form-field-label" for="title">Название <span class="form-field-required">*</span></label>
              <span class="form-field-hint" id="title-counter">0 / 80</span>
            </div>
            <input class="input" id="title" name="title" required minlength="3" maxlength="80" placeholder="Например, «Сверстать экран команды»" aria-describedby="title-error">
            <p class="form-field-error" id="title-error">Добавьте название — от 3 до 80 символов</p>
          </div>

          <div class="form-field">
            <label class="form-field-label" for="description">Описание</label>
            <textarea class="input input-multiline" id="description" name="description" rows="4" placeholder="Что нужно сделать и как понять, что готово"></textarea>
          </div>

          <div class="task-form-row">
            <div class="form-field">
              <label class="form-field-label" for="status">Статус</label>
              <select class="input select" id="status" name="status">
                <option value="backlog" selected>Бэклог</option>
                <option value="progress">В работе</option>
                <option value="review">На ревью</option>
                <option value="done">Готово</option>
              </select>
            </div>

            <fieldset class="form-field priority-picker">
              <legend class="form-field-label">Приоритет</legend>
              <div class="priority-picker-options">
                <label class="priority-picker-option">
                  <input class="visually-hidden" type="radio" name="priority" value="high">
                  <span class="priority-picker-dot priority-picker-dot-high"></span>
                  Высокий
                </label>
                <label class="priority-picker-option">
                  <input class="visually-hidden" type="radio" name="priority" value="medium" checked>
                  <span class="priority-picker-dot priority-picker-dot-medium"></span>
                  Средний
                </label>
                <label class="priority-picker-option">
                  <input class="visually-hidden" type="radio" name="priority" value="low">
                  <span class="priority-picker-dot priority-picker-dot-low"></span>
                  Низкий
                </label>
              </div>
            </fieldset>
          </div>

          <div class="task-form-row">
            <div class="form-field">
              <label class="form-field-label" for="assignee">Исполнитель</label>
              <select class="input select" id="assignee" name="assignee">
                <option value="" selected>Выберите участника</option>
              </select>
            </div>

            <div class="form-field">
              <label class="form-field-label" for="due">Дедлайн</label>
              <input class="input" id="due" name="due" type="date" aria-describedby="due-error">
              <p class="form-field-error" id="due-error">Дедлайн не может быть в прошлом</p>
            </div>
          </div>

          <fieldset class="tag-picker">
            <legend class="form-field-label">Теги</legend>
            <div class="tag-picker-options" id="tag-options"></div>
            <div class="tag-picker-new">
              <input class="input" id="new-tag-input" maxlength="24" placeholder="Новый тег" aria-label="Новый тег">
              <button class="button button-secondary" id="new-tag-button" type="button">Добавить</button>
            </div>
          </fieldset>

          <div class="task-form-actions">
            <button class="button button-secondary task-form-reset" id="form-reset" type="reset">Очистить</button>
            <a class="button button-secondary task-form-cancel" id="form-cancel" href="index.html">Отмена</a>
            <button class="button button-primary task-form-submit" id="form-submit">Создать задачу</button>
          </div>
        </form>

        <aside class="task-preview">
          <h2 class="task-preview-caption">Так задача появится на доске</h2>
          <article class="task-card task-preview-card" id="task-preview-card"></article>
          <p class="task-preview-column" id="task-preview-column"></p>
        </aside>
      </div>
    </main>
  </div>
</body>
</html>
